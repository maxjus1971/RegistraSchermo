name: Genera APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica progetto
        uses: actions/checkout@v4

      - name: Estrai progetto Android
        run: unzip -q RegistraSchermo-progetto-Android.zip

      - name: Installa Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Installa Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK
        working-directory: RegistraSchermo
        run: gradle assembleDebug --no-daemon

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: RegistraSchermo-APK
          path: RegistraSchermo/app/build/outputs/apk/debug/app-debug.apk
