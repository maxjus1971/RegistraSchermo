name: Genera APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Estrai il progetto Android
        run: unzip -q RegistraSchermo-progetto-Android.zip

      - name: Applica sorgenti aggiornati
        run: |
          cp overrides/MainActivity.java RegistraSchermo/app/src/main/java/it/example/registraschermo/MainActivity.java
          cp overrides/ScreenCaptureService.java RegistraSchermo/app/src/main/java/it/example/registraschermo/ScreenCaptureService.java
          cp overrides/AvRecorder.java RegistraSchermo/app/src/main/java/it/example/registraschermo/AvRecorder.java
          cp overrides/FloatingControls.java RegistraSchermo/app/src/main/java/it/example/registraschermo/FloatingControls.java
          cp overrides/AndroidManifest.xml RegistraSchermo/app/src/main/AndroidManifest.xml
          cp overrides/activity_main.xml RegistraSchermo/app/src/main/res/layout/activity_main.xml
          cp overrides/build.gradle.kts RegistraSchermo/app/build.gradle.kts

      - name: Configura Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara Android SDK
        uses: android-actions/setup-android@v4

      - name: Installa SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configura Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compila APK debug
        working-directory: RegistraSchermo
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: RegistraSchermo-APK
          path: RegistraSchermo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
